<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fathoms">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#090b0e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <title>Log in — Fathoms</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/landing.css">
  <script src="/js/pwa.js"></script>
</head>
<body class="landing-body login-body">
  <main class="init-panel page-enter">
    <a href="/" class="init-back">← Back</a>
    <p class="landing-eyebrow">Welcome back</p>
    <h1 class="init-title">Log in</h1>
    <p class="init-lead">Pick up where you left off.</p>

    <form id="login-form" class="init-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          maxlength="24"
          minlength="2"
          autocomplete="username"
          placeholder="Your username"
          required
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            name="password"
            minlength="6"
            autocomplete="current-password"
            placeholder="Your password"
            required
          >
          <button
            type="button"
            class="password-toggle"
            id="password-toggle"
            aria-label="Show password"
            aria-pressed="false"
          >Show</button>
        </div>
      </div>

      <p id="login-error" class="error-banner" style="display:none; color:#ff4d4d;" role="alert"></p>

      <button type="submit" id="login-submit" class="btn btn-primary btn-lg" style="width:100%">
        Log in
      </button>
    </form>

    <p class="init-note">No account yet? <a href="/init">Create one</a></p>
  </main>

  <footer class="login-footer">
    <p>Need help? <a href="mailto:thenoahchang@gmail.com">Contact support</a></p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
